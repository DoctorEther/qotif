; Qotif game configuration: Half-Life (GoldSrc)
; WAD3 textures carry their own palettes, so no palette file is needed.
; Put halflife.fgd (from the Valve Hammer Editor or the community FGD)
; next to this file, or point the map's _tb_def key at it.

[game]
name = Half-Life
basedir = valve
palette =
mapformat = valve220
entities = halflife.fgd
defaulttexture =
wads = halflife.wad;liquids.wad;decals.wad

[variables]
CSG = hlcsg
BSP = hlbsp
VIS = hlvis
RAD = hlrad
ENGINE = hl_linux
MOD = valve

[profile Full]
cmd = ${CSG} "${MAP_BASE}"
cmd = ${BSP} "${MAP_BASE}"
cmd = ${VIS} "${MAP_BASE}"
cmd = ${RAD} "${MAP_BASE}"
cmd = mkdir -p "${GAME_DIR}/${MOD}/maps" && cp "${MAP_BASE}.bsp" "${GAME_DIR}/${MOD}/maps/"
cmd = cd "${GAME_DIR}" && ./${ENGINE} -game ${MOD} +map ${MAP_NAME}

[profile Fast]
cmd = ${CSG} "${MAP_BASE}"
cmd = ${BSP} "${MAP_BASE}"
cmd = ${VIS} -fast "${MAP_BASE}"
cmd = ${RAD} -fast "${MAP_BASE}"
