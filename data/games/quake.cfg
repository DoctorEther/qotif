; Qotif game configuration: Quake
; Copy to config/games/ (next to the executable) to override. Set the game path in
; Edit > Preferences > Games.

[game]
name = Quake
basedir = id1
palette = gfx/palette.lmp
mapformat = standard
entities = quake.fgd
defaulttexture =
wads =

; defaults for ${NAME} variables; override them per game in Preferences
[variables]
QBSP = qbsp
LIGHT = light
VIS = vis
ENGINE = quakespasm
MOD = id1

[profile Full]
cmd = ${QBSP} "${MAP_FILE}"
cmd = ${VIS} -level 4 "${MAP_BASE}.bsp"
cmd = ${LIGHT} -extra4 "${MAP_BASE}.bsp"
cmd = mkdir -p "${GAME_DIR}/${MOD}/maps" && cp "${MAP_BASE}.bsp" "${GAME_DIR}/${MOD}/maps/"
cmd = ${ENGINE} -basedir "${GAME_DIR}" -game ${MOD} +map ${MAP_NAME}

[profile Fast (no vis)]
cmd = ${QBSP} "${MAP_FILE}"
cmd = ${LIGHT} "${MAP_BASE}.bsp"
cmd = mkdir -p "${GAME_DIR}/${MOD}/maps" && cp "${MAP_BASE}.bsp" "${GAME_DIR}/${MOD}/maps/"
cmd = ${ENGINE} -basedir "${GAME_DIR}" -game ${MOD} +map ${MAP_NAME}

[profile BSP only]
cmd = ${QBSP} "${MAP_FILE}"
